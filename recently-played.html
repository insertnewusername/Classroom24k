<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recently Played | Classroom 24k</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header onclick="location.href='index.html'">
        <h1>Classroom 24k</h1>
    </header>

    <nav></nav>

    <div class="container">
        <h2 style="text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; color: #00aaff; text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);">
            Recently Played
        </h2>

        <div class="game-grid" id="recently-played-grid">
            <!-- populated by script.js -->
            <div style="padding:40px; text-align:center; color:#aaa; font-size:1.2rem;">
                Loading...
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Wait for auth to be ready, then load games
        function initRecentlyPlayed() {
            // If we have a current user, load
            if (typeof currentUser !== 'undefined' && currentUser) {
                loadAllRecentlyPlayed();
                return;
            }

            // If auth is defined but no user yet, listen for changes
            if (typeof auth !== 'undefined') {
                // If already signed in, auth listener will fire; but we also need to handle initial state
                const unsubscribe = auth.onAuthStateChanged(function(user) {
                    if (user) {
                        loadAllRecentlyPlayed();
                        unsubscribe(); // clean up listener
                    } else {
                        // Not signed in
                        const grid = document.getElementById('recently-played-grid');
                        if (grid) {
                            grid.innerHTML = `<div style="padding:40px; text-align:center; color:#aaa; font-size:1.2rem;">Sign in to see your recently played games.</div>`;
                        }
                        unsubscribe();
                    }
                });
            } else {
                // Firebase not loaded yet, retry after a short delay
                setTimeout(initRecentlyPlayed, 300);
            }
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initRecentlyPlayed);
        } else {
            initRecentlyPlayed();
        }
    </script>
</body>
</html>
