<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Games | Classroom 24k</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header onclick="location.href='index.html'">
        <h1>Classroom 24k</h1>
    </header>

    <nav></nav>

        <h2 style="text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; color: #00aaff; text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);">
            Multiplayer games
        </h2>

        <div class="game-grid">
            <a href="bloxd-io.html" class="game-card">
                <div class="game-img-container">
                    <img src="https://cdn2.spatial.io/assets/v1/static/external_games/bloxd-io.jpeg" alt="Bloxd.io">
                </div>
                <div class="game-info">
                    <h3>Bloxd.io</h3>
                </div>
            </a>

            <a href="tag.html" class="game-card">
                <div class="game-img-container">
                    <img src="https://abinbins.github.io/thumb/tag.png" alt="Tag">
                </div>
                <div class="game-info">
                    <h3>Tag</h3>
                </div>
            </a>
            
            <a href="bumper-cars-soccer.html" class="game-card">
                <div class="game-img-container">
                    <img src="https://abinbins.github.io/thumb/bumper-cars-soccer.png" alt="Bumper Cars">
                </div>
                <div class="game-info">
                    <h3>Bumper Cars Soccer</h3>
                </div>
            </a>

            <a href="8-ball-pool.html" class="game-card">
                <div class="game-img-container">
                    <img src="https://abinbins.github.io/thumb/8-ball-pool.png" alt="8 Ball Pool">
                </div>
                <div class="game-info">

                </div>
            </a>

            <a href="basket-random.html" class="game-card">

                </div>
            </a>

            <a href="basketball-stars.html" class="game-card">

                </div>
                <div class="game-info">
                    <h3>Baskeball Stars</h3>
                </div>
            </a>

            <a href="javelin-fighting.html" class="game-card">
                <div class="game-img-container">
                    <img src="assets/javelin-fighting.jpg" alt="Javelin Fighting">
                </div>
                <div class="game-info">
                    <h3>Javelin Fighting</h3>
                </div>
            </a>

            <a href="rowdy-wrestling.html" class="game-card">
                <div class="game-img-container">
                    <img src="https://abinbins.github.io/thumb/rowdy-wrestling.png" alt="Rowdy Wrestling">
                </div>
                <div class="game-info">
                    <h3>Rowdy Wrestling</h3>
                </div>
